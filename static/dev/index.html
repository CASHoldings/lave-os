<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAVE OS preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&display=swap">
<style>
  /* Stand-in for the lavelondon.com WordPress chrome, so embeds can be checked in context. */
  body { margin: 0; font: 13px/1.6 "Century Gothic", "Questrial", Arial, sans-serif; color: #192033; background: #fff; }
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 28px 60px; border-bottom: 1px solid #eee; }
  header nav { display: flex; gap: 36px; font-size: 15px; letter-spacing: .02em; }
  header nav:last-child { justify-content: flex-end; }
  header a { color: inherit; text-decoration: none; text-transform: uppercase; }
  .logo { font-size: 44px; letter-spacing: .18em; font-weight: 300; padding-left: .18em; }
  .sub { display: flex; justify-content: center; gap: 50px; padding: 30px 0; border-bottom: 1px solid #eee; font-size: 17px; letter-spacing: .1em; }
  main { padding: 56px 24px 96px; }
  .devbar { position: fixed; bottom: 12px; left: 12px; background: #192033; color: #fff; padding: 8px 12px; font-size: 12px; z-index: 9; }
  .devbar a { color: #fff; margin-left: 10px; }
  @media (max-width: 900px) { header { grid-template-columns: 1fr; justify-items: center; gap: 12px; padding: 18px; } header nav { gap: 16px; font-size: 12px; flex-wrap: wrap; justify-content: center; } .sub { gap: 20px; font-size: 13px; } .logo { font-size: 32px; } }
</style>
</head>
<body>
<header>
  <nav><a href="#">Atelier</a><a href="#">Apothecary</a><a href="#">Membership</a><a href="#">Laveworld</a></nav>
  <a class="logo" href="?">LAVE</a>
  <nav><a href="#">Search</a><a href="?page=account">Account</a><a href="?">Book a collection</a></nav>
</header>
<div class="sub"><span>CLEAN</span><span>PRESERVE</span><span>VAULT</span><span>REHOME</span></div>
<main id="main"></main>
<div class="devbar">Local preview <a href="?">Booking</a><a href="?page=account">Account</a><a href="?guest=1">Signed out</a><a href="/admin">Staff dashboard</a></div>
<script src="/embed/lave.js"></script>
<script>
  (async () => {
    const q = new URLSearchParams(location.search);
    const tag = q.get("page") === "account" ? "lave-account" : "lave-booking";
    const el = document.createElement(tag);
    el.setAttribute("api", location.origin);
    el.setAttribute("login-url", "?");
    el.setAttribute("account-url", "?page=account");
    if (!q.get("guest")) {
      const tq = new URLSearchParams({ email: q.get("email") || "stanley@lavelondon.com", wp_id: q.get("wp_id") || "1001", first_name: q.get("name") || "Stanley" });
      const { token } = await fetch("/api/dev/wp-token?" + tq).then((r) => r.json());
      el.setAttribute("token", token);
    }
    document.getElementById("main").appendChild(el);
  })();
</script>
</body>
</html>
