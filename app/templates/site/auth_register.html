{% extends "site/_auth_layout.html" %}
{% block title %}Create an account | LAVE{% endblock %}
{% block card %}
<h1>Create an account</h1>
<p class="muted">Book collections, follow every garment, and manage your Vault and membership.</p>
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/account/register/" class="auth-form">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="two"><label>First name<input name="first_name" value="{{ form.first_name or '' }}" required autocomplete="given-name"></label>
  <label>Last name<input name="last_name" value="{{ form.last_name or '' }}" autocomplete="family-name"></label></div>
  <label>Email<input name="email" type="email" value="{{ form.email or '' }}" required autocomplete="email"></label>
  <label>Password<input name="password" type="password" required minlength="10" autocomplete="new-password"><span class="hint">At least 10 characters.</span></label>
  <button class="btn dark" type="submit">Create account</button>
</form>
<div class="auth-links"><a href="/account/login/?next={{ next|urlencode }}">Already have an account? Sign in</a></div>
{% endblock %}
