{% extends "site/_auth_layout.html" %}
{% block title %}Sign in | LAVE{% endblock %}
{% block card %}
<h1>Sign in</h1>
<p class="muted">Welcome back to LAVE.</p>
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/account/login/" class="auth-form">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Email<input name="email" type="email" value="{{ email }}" required autocomplete="email" autofocus></label>
  <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
  <button class="btn dark" type="submit">Sign in</button>
</form>
<div class="auth-links">
  <a href="/account/link/?next={{ next|urlencode }}">Email me a sign-in link instead</a>
  <a href="/account/link/?purpose=reset">Forgotten your password?</a>
</div>
<div class="auth-alt"><p>New to LAVE?</p><a class="btn" href="/account/register/?next={{ next|urlencode }}">Create an account</a></div>
{% endblock %}
